name: CI

on:
  push:
    branches: [main, media-detector]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências (backend)
        working-directory: backend
        run: npm install

      - name: Testes unitários
        working-directory: backend
        run: npm test
