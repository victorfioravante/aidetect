<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIDetect.pro — Logo Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080B0F;
      font-family: 'Space Grotesk', sans-serif;
      color: #E8F0F8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px;
    }
    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4A6278;
    }
    .card {
      background: #0E1318;
      border: 1px solid #1E2D3D;
      border-radius: 12px;
      padding: 32px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card.light {
      background: #F0F4F8;
    }
    .card.transparent {
      background: repeating-conic-gradient(#1E2D3D 0% 25%, #141C24 0% 50%) 0 0 / 12px 12px;
    }
    .row {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    hr {
      width: 100%;
      border: none;
      border-top: 1px solid #1E2D3D;
      max-width: 600px;
    }
    .sizes {
      display: flex;
      gap: 32px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- LOGO FULL -->
  <div class="section">

        <rect x="30" y="8"  width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <rect x="8"  y="19" width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <rect x="19" y="19" width="8" height="8" rx="1" fill="#0A1929" stroke="#00D4FF" stroke-width="0.75" />
        <rect x="30" y="19" width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <rect x="8"  y="30" width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <rect x="19" y="30" width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <rect x="30" y="30" width="8" height="8" rx="1" fill="#141C24" stroke="#1E2D3D" stroke-width="0.75" />
        <g clip-path="url(#grid-clip)">
          <line x1="2" y1="10" x2="34" y2="42" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" filter="url(#line-glow)" opacity="0.9" />
        </g>
        <line x1="2"  y1="6"  x2="2"  y2="2"  stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="2"  y1="2"  x2="6"  y2="2"  stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="38" y1="2"  x2="42" y2="2"  stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="42" y1="2"  x2="42" y2="6"  stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="2"  y1="38" x2="2"  y2="42" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="2"  y1="42" x2="6"  y2="42" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="38" y1="42" x2="42" y2="42" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />
        <line x1="42" y1="38" x2="42" y2="42" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#cyan-glow)" />

        <text x="168" y="28" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="18" fill="#4A6278">.pro</text>
      </svg>
    </div>
  </div>

  <hr />
